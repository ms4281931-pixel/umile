<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso de Páscoa</title>
<link rel="icon" href="https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png">
<style>
/* --- ESTILOS --- */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-x:hidden;position:relative;color:#fff;background:#0a0a1e;padding-top:30px;}
.bg-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-3;filter:brightness(0.5);pointer-events:none;}
body::after{content:"";position:absolute;width:100%;height:100%;z-index:-2;background:rgba(0,0,0,0.5);}
.container{position:relative;z-index:1;width:95%;max-width:600px;padding:30px;border-radius:25px;background:rgba(10,10,30,0.65);backdrop-filter:blur(15px);box-shadow:0 0 30px rgba(0,255,200,0.2);text-align:center;transition:0.3s;margin-bottom:30px;}
h1{color:#00ffd0;display:flex;align-items:center;justify-content:center;gap:10px;}
.title-icon{width:40px;height:40px;background:url('https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png') center/contain no-repeat;display:inline-block;}
p{color:#ccc;margin-bottom:20px;}
.btn{background:linear-gradient(45deg,#00ffd0,#7a2bff);border:none;padding:14px;border-radius:40px;cursor:pointer;margin:6px 0;color:#fff;font-weight:bold;transition:0.3s;}
.btn:hover{transform:scale(1.1);box-shadow:0 0 20px #00ffd0;}
.hidden{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-top:20px;}
.photo-card{position:relative;border-radius:15px;overflow:hidden;cursor:pointer;transition:0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.4);}
.photo-card img{width:100%;height:150px;object-fit:cover;display:block;}
.photo-info{position:absolute;bottom:0;width:100%;background:rgba(0,0,0,0.6);color:#00ffd0;padding:5px;font-size:0.85rem;text-align:center;}
.vote-btn{position:absolute;top:10px;right:10px;background:linear-gradient(45deg,#7a2bff,#00ffd0);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;transition:0.3s;}
.vote-btn:hover{transform:scale(1.2);box-shadow:0 0 10px #00ffd0;}
.loader{width:40px;height:40px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #00ffd0;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto;}
@keyframes spin{100%{transform:rotate(360deg);}}
.audio-control{position:fixed;bottom:20px;right:20px;z-index:100;background:rgba(10,10,30,0.8);padding:10px;border-radius:50%;cursor:pointer;border:1px solid #00ffd0;display:flex;align-items:center;justify-content:center;}
form{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
input, select{padding:12px;border-radius:12px;border:none;outline:none;font-size:1rem;}
input[type="file"]{padding:6px;background:rgba(255,255,255,0.1);color:#fff;}
</style>
</head>
<body>

<!-- Vídeo -->
<video autoplay muted loop playsinline class="bg-video">
  <source src="https://pikaso.cdnpk.net/private/production/3736007523/1d331a23-bf5a-41d2-9a4d-90cac23d30d8-0.mp4" type="video/mp4">
</video>

<!-- Áudio -->
<audio id="bgMusic" loop>
  <source src="https://soundimage.org/wp-content/uploads/2014/10/Light-Years_v001.mp3" type="audio/mpeg">
</audio>
<div class="audio-control" id="musicToggle">
  <span id="musicIcon">🔇</span>
</div>

<!-- Cadastro -->
<div class="container" id="step1">
  <h1><span class="title-icon"></span> Concurso de Páscoa</h1>
  <p>Cadastre-se e envie sua foto!</p>
  <form id="cadastroForm">
    <input type="text" placeholder="Nome completo" id="nome" required>
    <input type="text" placeholder="Setor" id="setor" required>
    <input type="text" placeholder="Empresa" id="empresa" required>
    <input type="file" id="foto" accept="image/*" required>
    <button type="submit" class="btn">Enviar Foto</button>
  </form>
</div>

<!-- Galeria -->
<div class="container hidden" id="step2">
  <h1>📸 Galeria de Páscoa</h1>
  <div class="grid" id="galleryGrid"></div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
  // ==== Supabase GLOBAL ====
  const supabaseUrl = "https://gfakakiwalrinnzsneps.supabase.co";
  const supabaseKey = "sb_publishable_qT7Xdk8KILijA6ctTQQjmw_c4KMfhg2";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  window.onload = function(){
    const bgMusic = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const musicToggle = document.getElementById('musicToggle');

    // Toggle music
    musicToggle.addEventListener('click', ()=>{
      if(bgMusic.paused){ bgMusic.play(); musicIcon.innerText="🔊"; } 
      else{ bgMusic.pause(); musicIcon.innerText="🔇"; }
    });

    const cadastroForm = document.getElementById('cadastroForm');
    cadastroForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const setor = document.getElementById('setor').value;
      const empresa = document.getElementById('empresa').value;
      const foto = document.getElementById('foto').files[0];
      if(!foto) return alert("Selecione uma foto");

      // Inserir usuário
      const { data:user, error:userErr } = await supabase.from("users").insert([{ nome,setor,empresa }]).select().single();
      if(userErr){ console.error(userErr); return alert("Erro ao cadastrar usuário"); }

      // Upload da foto
      const ext = foto.name.split('.').pop();
      const fileName = `${user.id}_${Date.now()}.${ext}`;
      const { error:uploadErr } = await supabase.storage.from("photos").upload(fileName,foto);
      if(uploadErr){ console.error(uploadErr); return alert("Erro ao enviar foto"); }

      // URL pública
      const { data:{publicUrl} } = supabase.storage.from("photos").getPublicUrl(fileName);

      // Salvar na tabela fotos
      const { error:photoErr } = await supabase.from("photos").insert([{ user_id:user.id,url:publicUrl }]);
      if(photoErr){ console.error(photoErr); return alert("Erro ao salvar foto"); }

      alert("Foto enviada com sucesso!");
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      loadGallery();
    });

    // Carregar galeria
    async function loadGallery(){
      const gallery = document.getElementById('galleryGrid');
      gallery.innerHTML="";
      const { data: photos, error } = await supabase.from("photos").select("id,url,user_id").order("id",{ascending:false});
      if(error){ console.error(error); return; }

      for(const photo of photos){
        const { data: userData } = await supabase.from("users").select("nome,setor,empresa").eq("id",photo.user_id).single();
        const card = document.createElement("div");
        card.className="photo-card";
        card.innerHTML=`
          <img src="${photo.url}" alt="Foto">
          <div class="photo-info">${userData.nome} - ${userData.setor}</div>
          <button class="vote-btn" data-id="${photo.id}">❤</button>
        `;
        gallery.appendChild(card);
      }

      // Votos
      document.querySelectorAll('.vote-btn').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const photoId = btn.getAttribute('data-id');
          const userId = prompt("Digite seu nome para votar (teste)"); 
          if(!userId) return;
          const { data: existing } = await supabase.from("votes").select("*").eq("user_id",userId).eq("photo_id",photoId).single();
          if(existing) return alert("Você já votou nesta foto!");
          const { error: voteErr } = await supabase.from("votes").insert([{ user_id:userId,photo_id:photoId }]);
          if(voteErr){ console.error(voteErr); return alert("Erro ao registrar voto"); }
          alert("Voto registrado!");
          loadGallery();
        });
      });
    }

    loadGallery();
  }
</script>
</body>
</html>
