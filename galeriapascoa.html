<script>
// ==========================================
// CONFIGURAÇÃO DO SUPABASE
// ==========================================
const SUPABASE_URL = 'https://gfakakiwalrinznneps.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmYWtha2l3YWxyaW5uenNuZXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTcxOTgsImV4cCI6MjA5MDQ3MzE5OH0.aLxukBEN-XBfNKqiSPWBQxOF2W7CRHhAroHOXXzmkYY';

// Inicializa o cliente do Supabase
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Variáveis globais
let dados = [];
let votosUsuario = JSON.parse(localStorage.getItem('votosUsuarioPascoa')) || [];

// ==========================================
// FUNÇÕES PRINCIPAIS
// ==========================================

async function carregarDados() {
  try {
    const { data, error } = await supabase
      .from('galeria')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    
    dados = data;
    render();
  } catch (error) {
    console.error('Erro ao carregar dados:', error);
    alert('Erro ao carregar a galeria.');
  }
}

async function enviar() {
  const nome = document.getElementById('nome').value.trim();
  const setor = document.getElementById('setor').value.trim();
  const empresa = document.getElementById('empresa').value.trim();
  const file = document.getElementById('imagem').files[0];

  if (!nome || !setor || !empresa || !file) {
    alert('Preencha tudo!');
    return;
  }

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = Date.now() + '.' + fileExt;

    await supabase.storage
      .from('fotos-pascoa')
      .upload(fileName, file);

    const { data } = supabase.storage
      .from('fotos-pascoa')
      .getPublicUrl(fileName);

    await supabase.from('galeria').insert([
      {
        nome,
        setor,
        empresa,
        img_url: data.publicUrl,
        votos: 0
      }
    ]);

    alert('Enviado!');
    carregarDados();

  } catch (err) {
    console.error(err);
    alert('Erro ao enviar');
  }
}

async function votar(id, votos) {
  if (votosUsuario.includes(id)) {
    alert('Você já votou!');
    return;
  }

  await supabase
    .from('galeria')
    .update({ votos: votos + 1 })
    .eq('id', id);

  votosUsuario.push(id);
  localStorage.setItem('votosUsuarioPascoa', JSON.stringify(votosUsuario));

  carregarDados();
}

// ==========================================
// RENDER
// ==========================================

function render() {
  const galeria = document.getElementById('galeria');
  galeria.innerHTML = '';

  dados.forEach(item => {
    const jaVotou = votosUsuario.includes(item.id);

    galeria.innerHTML += `
      <div class="card">
        <img src="${item.img_url}">
        <p><b>${item.nome}</b></p>
        <p>${item.setor}</p>
        <p>${item.empresa}</p>
        <p>⭐ ${item.votos}</p>
        <button class="vote-btn" ${jaVotou ? 'disabled' : ''}
          onclick="votar(${item.id}, ${item.votos})">
          ${jaVotou ? 'Já votou' : 'Votar'}
        </button>
      </div>
    `;
  });

  renderRanking();
}

function renderRanking() {
  const ranking = document.getElementById('ranking');
  ranking.innerHTML = '';

  const top = [...dados]
    .sort((a,b)=>b.votos-a.votos)
    .slice(0,5);

  top.forEach((item, i) => {
    ranking.innerHTML += `
      <div class="card">
        <img src="${item.img_url}">
        <p><b>${i+1}º ${item.nome}</b></p>
        <p>⭐ ${item.votos}</p>
      </div>
    `;
  });
}

// INIT
carregarDados();

</script>
