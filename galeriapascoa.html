<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoSRQNZNIfSZq8db0XG-sZui1jxnNLBEU",
  authDomain: "pascoagovernanca.firebaseapp.com",
  projectId: "pascoagovernanca",
  storageBucket: "pascoagovernanca.firebasestorage.app",
  messagingSenderId: "1014731249644",
  appId: "1:1014731249644:web:347ec3f10573973956d2c9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let votosUsuario = JSON.parse(localStorage.getItem('votosUsuario')) || [];

function salvarLocal(){
  localStorage.setItem('votosUsuario', JSON.stringify(votosUsuario));
}

async function enviar(){
  const nome = document.getElementById('nome').value;
  const setor = document.getElementById('setor').value;
  const empresa = document.getElementById('empresa').value;
  const file = document.getElementById('imagem').files[0];

  if(!nome || !setor || !empresa || !file){
    alert('Preencha tudo');
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e){
    await addDoc(collection(db, "fotos"), {
      nome,
      setor,
      empresa,
      img: e.target.result,
      votos: 0
    });
    carregar();
  }
  reader.readAsDataURL(file);
}

async function votar(id){
  if(votosUsuario.includes(id)) return;

  const ref = doc(db, "fotos", id);
  const snapshot = await getDocs(collection(db, "fotos"));

  snapshot.forEach(async (d)=>{
    if(d.id === id){
      const dados = d.data();
      await updateDoc(ref, { votos: dados.votos + 1 });
    }
  });

  votosUsuario.push(id);
  salvarLocal();
  carregar();
}

async function carregar(){
  const galeria = document.getElementById('galeria');
  galeria.innerHTML = '';

  const querySnapshot = await getDocs(collection(db, "fotos"));
  let dados = [];

  querySnapshot.forEach((docSnap)=>{
    dados.push({id: docSnap.id, ...docSnap.data()});
  });

  dados.forEach((item)=>{
    const jaVotou = votosUsuario.includes(item.id);

    galeria.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <p><b>${item.nome}</b></p>
        <p>${item.setor}</p>
        <p>${item.empresa}</p>
        <p>⭐ ${item.votos}</p>
        <button class="vote-btn" ${jaVotou ? 'disabled' : ''} onclick="votar('${item.id}')">
          ${jaVotou ? 'Já votou' : 'Votar'}
        </button>
      </div>
    `;
  });

  renderRanking(dados);
}

function renderRanking(dados){
  const ranking = document.getElementById('ranking');
  ranking.innerHTML = '';

  const top = [...dados].sort((a,b)=>b.votos-a.votos).slice(0,5);

  top.forEach(item=>{
    ranking.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <p><b>${item.nome}</b></p>
        <p>⭐ ${item.votos}</p>
      </div>
    `;
  });
}

window.enviar = enviar;
window.votar = votar;

carregar();
</script>
