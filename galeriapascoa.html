<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso de Páscoa</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-x:hidden;position:relative;background:#0a0a1e;color:#fff;}
.bg-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-3;filter:brightness(0.4);pointer-events:none;}
body::after{content:"";position:absolute;width:100%;height:100%;z-index:-2;background:rgba(0,0,0,0.6);}
.container{position:relative;z-index:1;width:95%;max-width:600px;padding:30px;border-radius:25px;background:rgba(10,10,30,0.75);backdrop-filter:blur(15px);box-shadow:0 0 40px rgba(0,255,200,0.3);text-align:center;margin-bottom:30px;transition:all 0.3s ease;}
h1{color:#00ffd0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.8rem;animation:fadeIn 1s ease;}
.title-icon{width:50px;height:50px;background:url('https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png') center/contain no-repeat;display:inline-block;}
p{color:#ccc;margin-bottom:20px;font-size:1rem;animation:fadeIn 1s 0.3s ease both;}
.btn{background:linear-gradient(45deg,#00ffd0,#7a2bff);border:none;padding:14px 24px;border-radius:50px;cursor:pointer;margin:10px 0;color:#fff;font-weight:bold;font-size:1rem;transition:0.3s;animation:fadeIn 1s 0.5s ease both;}
.btn:hover{transform:scale(1.1);box-shadow:0 0 25px #00ffd0;}
.hidden{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-top:20px;animation:fadeIn 1s ease;}
.photo-card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;transition:transform 0.3s, box-shadow 0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.5);}
.photo-card:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,255,200,0.5);}
.photo-card img{width:100%;height:150px;object-fit:cover;display:block;}
.photo-info{position:absolute;bottom:0;width:100%;background:rgba(0,0,0,0.7);color:#00ffd0;padding:6px;font-size:0.85rem;text-align:center;}
.vote-btn{position:absolute;top:10px;right:10px;background:linear-gradient(45deg,#7a2bff,#00ffd0);border:none;border-radius:50%;width:35px;height:35px;cursor:pointer;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;transition:0.3s;}
.vote-btn:hover{transform:scale(1.3);box-shadow:0 0 15px #00ffd0;}
.rank-list{margin-top:20px;text-align:left;animation:fadeIn 1s 0.3s ease both;}
.rank-list li{background:rgba(0,255,200,0.1);margin:8px 0;padding:10px;border-radius:12px;list-style:none;display:flex;justify-content:space-between;align-items:center;transition:0.3s;}
.rank-list li:hover{background:rgba(0,255,200,0.2);}
.audio-control{position:fixed;bottom:20px;right:20px;z-index:100;background:rgba(10,10,30,0.8);padding:12px;border-radius:50%;cursor:pointer;border:1px solid #00ffd0;display:flex;align-items:center;justify-content:center;transition:0.3s;}
.audio-control:hover{transform:scale(1.2);box-shadow:0 0 15px #00ffd0;}
form{display:flex;flex-direction:column;gap:12px;margin-top:10px;animation:fadeIn 1s 0.5s ease both;}
input, select{padding:12px;border-radius:12px;border:none;outline:none;font-size:1rem;}
input[type="file"]{padding:8px;background:rgba(255,255,255,0.1);color:#fff;}
@keyframes fadeIn{0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<video autoplay muted loop playsinline class="bg-video">
  <source src="https://pikaso.cdnpk.net/private/production/3736007523/1d331a23-bf5a-41d2-9a4d-90cac23d30d8-0.mp4" type="video/mp4">
</video>

<audio id="bgMusic" loop>
  <source src="https://soundimage.org/wp-content/uploads/2014/10/Light-Years_v001.mp3" type="audio/mpeg">
</audio>
<div class="audio-control" onclick="toggleMusic()" title="Ligar/Desligar Música">
  <span id="musicIcon">🔇</span>
</div>

<div class="container" id="step1">
  <h1><span class="title-icon"></span> Concurso de Páscoa</h1>
  <p>Cadastre-se e envie sua foto!</p>
  <form id="cadastroForm">
    <input type="text" placeholder="Nome completo" id="nome" required>
    <input type="text" placeholder="Setor" id="setor" required>
    <input type="text" placeholder="Empresa" id="empresa" required>
    <input type="file" id="foto" accept="image/*" required>
    <button type="submit" class="btn">Enviar Foto</button>
  </form>
</div>

<div class="container hidden" id="step2">
  <h1>📸 Galeria de Páscoa</h1>
  <div class="grid" id="galleryGrid"></div>
  <h2 class="hidden" id="rankingTitle">🏆 Top 5 Fotos</h2>
  <ol class="rank-list hidden" id="rankingList"></ol>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
const supabaseUrl = "https://gfakakiwalrinnzsneps.supabase.co";
const supabaseKey = "sb_publishable_qT7Xdk8KILijA6ctTQQjmw_c4KMfhg2";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

const bgMusic = document.getElementById('bgMusic');
const musicIcon = document.getElementById('musicIcon');
function toggleMusic(){ if(bgMusic.paused){ bgMusic.play(); musicIcon.innerText="🔊"; } else{ bgMusic.pause(); musicIcon.innerText="🔇"; } }

const cadastroForm = document.getElementById('cadastroForm');
cadastroForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const setor = document.getElementById('setor').value.trim();
    const empresa = document.getElementById('empresa').value.trim();
    const foto = document.getElementById('foto').files[0];
    if(!foto) return alert("Selecione uma foto");

    try {
        // Criar usuário
        const { data:user, error:userErr } = await supabase.from("users").insert([{ nome,setor,empresa }]).select().single();
        if(userErr) throw userErr;

        // Upload da foto
        const fileExt = foto.name.split('.').pop();
        const fileName = `${user.id}_${Date.now()}.${fileExt}`;
        const { error: uploadErr } = await supabase.storage.from("photos").upload(fileName, foto);
        if(uploadErr) throw uploadErr;

        // URL pública
        const { data: { publicUrl } } = supabase.storage.from("photos").getPublicUrl(fileName);

        // Inserir na tabela
        const { error: photoErr } = await supabase.from("photos").insert([{ user_id: user.id, url: publicUrl }]);
        if(photoErr) throw photoErr;

        alert("Foto enviada com sucesso!");
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        loadGallery();
    } catch(err){
        console.error(err);
        alert("Erro ao enviar dados. Confira se o bucket 'photos' existe no Supabase e tente novamente.");
    }
});

async function loadGallery(){
    const gallery = document.getElementById('galleryGrid');
    gallery.innerHTML="";
    const { data: photos, error } = await supabase.from("photos").select("id,url,user_id,votes(user_id)").order("id",{ascending:false});
    if(error){ console.error(error); return; }

    for(const photo of photos){
        const { data: userData } = await supabase.from("users").select("nome,setor").eq("id",photo.user_id).single();
        const card = document.createElement("div");
        card.className="photo-card";
        card.innerHTML=`
          <img src="${photo.url}" alt="Foto">
          <div class="photo-info">${userData.nome} - ${userData.setor}</div>
          <button class="vote-btn" onclick="votePhoto(${photo.id})">❤</button>
        `;
        gallery.appendChild(card);
    }
    loadRanking();
}

async function votePhoto(photoId){
    const userId = prompt("Digite seu nome ou ID para votar");
    if(!userId) return;
    const { data: existing } = await supabase.from("votes").select("*").eq("user_id",userId).eq("photo_id",photoId).single();
    if(existing) return alert("Você já votou nesta foto!");
    const { error } = await supabase.from("votes").insert([{ user_id: userId, photo_id: photoId }]);
    if(error){ console.error(error); return alert("Erro ao registrar voto"); }
    alert("Voto registrado!");
    loadGallery();
}

async function loadRanking(){
    const { data: ranking } = await supabase.from("photos").select("id,url,user_id,votes(user_id)").order('votes',{ascending:false});
    const top5 = ranking.slice(0,5);
    const rankingList = document.getElementById('rankingList');
    rankingList.innerHTML="";
    if(top5.length>0){
        document.getElementById('rankingTitle').classList.remove('hidden');
        rankingList.classList.remove('hidden');
        for(const photo of top5){
            const { data: userData } = await supabase.from("users").select("nome,setor").eq("id",photo.user_id).single();
            const votesCount = photo.votes ? photo.votes.length : 0;
            const li = document.createElement("li");
            li.innerHTML=`<span>${userData.nome} - ${userData.setor}</span> <span>❤️ ${votesCount}</span>`;
            rankingList.appendChild(li);
        }
    }
}

loadGallery();
</script>
</body>
</html>
