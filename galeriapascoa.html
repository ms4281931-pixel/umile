<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Páscoa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  filter:brightness(0.5);
}

body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

.container{
  width:95%;
  max-width:900px;
  background:rgba(10,10,30,0.65);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:20px;
}

h1{
  text-align:center;
  color:#00ffd0;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#00ffd0,#7a2bff);
  color:#fff;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:10px;
  text-align:center;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.vote-btn{
  margin-top:8px;
  background:#00ffd0;
  color:#000;
  border:none;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline class="bg-video">
  <source src="https://pikaso.cdnpk.net/private/production/3736007523/1d331a23-bf5a-41d2-9a4d-90cac23d30d8-0.mp4" type="video/mp4">
</video>

<div class="container">
  <h1>🐰 Galeria de Páscoa</h1>

  <input type="text" id="nome" placeholder="Seu nome">
  <input type="text" id="setor" placeholder="Seu setor">
  <input type="text" id="empresa" placeholder="Sua empresa">
  <input type="file" id="imagem">
  <button class="btn" onclick="enviar()">Enviar Foto</button>

  <div class="grid" id="galeria"></div>

  <h1>🏆 Top 5</h1>
  <div class="grid" id="ranking"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoSRQNZNIfSZq8db0XG-sZui1jxnNLBEU",
  authDomain: "pascoagovernanca.firebaseapp.com",
  projectId: "pascoagovernanca",
  storageBucket: "pascoagovernanca.firebasestorage.app",
  messagingSenderId: "1014731249644",
  appId: "1:1014731249644:web:347ec3f10573973956d2c9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

async function enviar(){
  const nome = document.getElementById('nome').value;
  const setor = document.getElementById('setor').value;
  const empresa = document.getElementById('empresa').value;
  const file = document.getElementById('imagem').files[0];

  if(!nome || !setor || !empresa || !file){
    alert("Preencha tudo");
    return;
  }

  // upload imagem
  const storageRef = ref(storage, 'fotos/' + Date.now());
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  // salvar no banco
  await addDoc(collection(db, "galeria"), {
    nome, setor, empresa,
    img: url,
    votos: 0
  });

  carregar();
}

async function votar(id, votos){
  const refDoc = doc(db, "galeria", id);
  await updateDoc(refDoc, {
    votos: votos + 1
  });

  carregar();
}

async function carregar(){
  const querySnapshot = await getDocs(collection(db, "galeria"));

  let dados = [];

  querySnapshot.forEach(docSnap=>{
    dados.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  render(dados);
}

function render(dados){
  const galeria = document.getElementById('galeria');
  galeria.innerHTML = '';

  dados.forEach(item=>{
    galeria.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <p><b>${item.nome}</b></p>
        <p>${item.setor}</p>
        <p>${item.empresa}</p>
        <p>⭐ ${item.votos}</p>
        <button class="vote-btn" onclick="votar('${item.id}', ${item.votos})">
          Votar
        </button>
      </div>
    `;
  });

  renderRanking(dados);
}

function renderRanking(dados){
  const ranking = document.getElementById('ranking');
  ranking.innerHTML = '';

  const top = [...dados].sort((a,b)=>b.votos-a.votos).slice(0,5);

  top.forEach(item=>{
    ranking.innerHTML += `
      <div class="card">
        <img src="${item.img}">
        <p><b>${item.nome}</b></p>
        <p>⭐ ${item.votos}</p>
      </div>
    `;
  });
}

carregar();

window.enviar = enviar;
window.votar = votar;
</script>

</body>
</html>
