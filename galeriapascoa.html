<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Páscoa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;}
.bg-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(0.5);}
body::after{content:"";position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1;}
.container{width:95%;max-width:900px;background:rgba(10,10,30,0.65);backdrop-filter:blur(15px);padding:25px;border-radius:20px;box-shadow:0 0 30px rgba(0,255,200,0.2);}
h1{text-align:center;color:#00ffd0;margin-bottom:15px;}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.6);color:#fff;outline:none;}
input::placeholder{color:#aaa;}
input[type="file"]{background:rgba(0,0,0,0.6);}
.btn{width:100%;padding:12px;border:none;border-radius:30px;background:linear-gradient(45deg,#00ffd0,#7a2bff);color:#fff;cursor:pointer;margin-top:10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px;}
.card{background:rgba(255,255,255,0.05);border-radius:15px;padding:10px;text-align:center;}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;}
.vote-btn{margin-top:8px;background:#00ffd0;color:#000;border:none;padding:6px 10px;border-radius:20px;cursor:pointer;}
.vote-btn:disabled{background:#555;cursor:not-allowed;}
.ranking{margin-top:30px;}
@media(max-width:500px){.card img{height:120px;}}
</style>
</head>

<body>

<video autoplay muted loop playsinline class="bg-video">
  <source src="https://pikaso.cdnpk.net/private/production/3736007523/1d331a23-bf5a-41d2-9a4d-90cac23d30d8-0.mp4?token=exp=1774742400~hmac=dd265f6cdfd621de05c13421667bed2930f2fb692a2bf5333147c0b5c82f1d7a" type="video/mp4">
</video>

<div class="container">
  <h1>🐰 Galeria de Páscoa</h1>

  <input type="text" id="nome" placeholder="Seu nome">
  <input type="text" id="setor" placeholder="Seu setor">
  <input type="text" id="empresa" placeholder="Sua empresa">
  <input type="file" id="imagem" accept="image/*">
  <button class="btn" id="btnEnviar">Enviar Foto</button>

  <div class="grid" id="galeria"></div>

  <div class="ranking">
    <h1>🏆 Top 5</h1>
    <div class="grid" id="ranking"></div>
  </div>
</div>

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.1/firebase-firestore-compat.js"></script>

<script>
  // Configuração do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCoSRQNZNIfSZq8db0XG-sZui1jxnNLBEU",
    authDomain: "pascoagovernanca.firebaseapp.com",
    projectId: "pascoagovernanca",
    storageBucket: "pascoagovernanca.appspot.com",
    messagingSenderId: "1014731249644",
    appId: "1:1014731249644:web:347ec3f10573973956d2c9"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let votosUsuario = JSON.parse(localStorage.getItem('votosUsuario')) || [];

  // Enviar foto com compressão
  document.getElementById('btnEnviar').addEventListener('click', () => {
    const nome = document.getElementById('nome').value;
    const setor = document.getElementById('setor').value;
    const empresa = document.getElementById('empresa').value;
    const file = document.getElementById('imagem').files[0];

    if(!nome || !setor || !empresa || !file){
      alert('Preencha tudo');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        const maxWidth = 400;
        const scaleSize = maxWidth / img.width;
        canvas.width = maxWidth;
        canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imgBase64 = canvas.toDataURL('image/jpeg', 0.7);

        db.collection('galeriaPascoa').add({
          nome, setor, empresa,
          img: imgBase64,
          votos: 0
        }).then(()=>{
          document.getElementById('nome').value = '';
          document.getElementById('setor').value = '';
          document.getElementById('empresa').value = '';
          document.getElementById('imagem').value = '';
          render();
        }).catch(err=>{
          alert('Erro ao enviar imagem: ' + err);
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Votar
  function votar(docId){
    if(votosUsuario.includes(docId)) return;

    const docRef = db.collection('galeriaPascoa').doc(docId);
    docRef.get().then(docSnap=>{
      if(docSnap.exists){
        docRef.update({ votos: docSnap.data().votos + 1 }).then(()=>{
          votosUsuario.push(docId);
          localStorage.setItem('votosUsuario', JSON.stringify(votosUsuario));
          render();
        });
      }
    });
  }

  // Renderizar galeria
  function render(){
    const galeriaDiv = document.getElementById('galeria');
    galeriaDiv.innerHTML = '';

    db.collection('galeriaPascoa').get().then(snapshot=>{
      let dados = [];
      snapshot.forEach(doc => dados.push({id: doc.id, ...doc.data()}));

      dados.forEach(item=>{
        const jaVotou = votosUsuario.includes(item.id);
        galeriaDiv.innerHTML += `
          <div class="card">
            <img src="${item.img}">
            <p><b>${item.nome}</b></p>
            <p>${item.setor}</p>
            <p>${item.empresa}</p>
            <p>⭐ ${item.votos}</p>
            <button class="vote-btn" ${jaVotou ? 'disabled' : ''} onclick="votar('${item.id}')">
              ${jaVotou ? 'Já votou' : 'Votar'}
            </button>
          </div>
        `;
      });

      renderRanking(dados);
    });
  }

  function renderRanking(dados){
    const ranking = document.getElementById('ranking');
    ranking.innerHTML = '';
    const top = [...dados].sort((a,b)=>b.votos - a.votos).slice(0,5);
    top.forEach(item=>{
      ranking.innerHTML += `
        <div class="card">
          <img src="${item.img}">
          <p><b>${item.nome}</b></p>
          <p>⭐ ${item.votos}</p>
        </div>
      `;
    });
  }

  render();
</script>

</body>
</html>
