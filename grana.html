<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro Família Santos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --primary:#8b5cf6;
    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;
    --text:#f8fafc;
    --text2:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:260px;
    background:#020617;
    padding:25px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
}

.logo{
    font-size:22px;
    font-weight:700;
    margin-bottom:35px;
    color:white;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu button{
    background:none;
    border:none;
    color:white;
    text-align:left;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
}

.menu button:hover{
    background:var(--primary);
}

.main{
    flex:1;
    margin-left:260px;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    font-size:28px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:var(--card);
    padding:22px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

.card h3{
    font-size:14px;
    color:var(--text2);
    margin-bottom:10px;
}

.card .valor{
    font-size:28px;
    font-weight:700;
}

.verde{
    color:var(--success);
}

.roxo{
    color:var(--primary);
}

.azul{
    color:#38bdf8;
}

.graficos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.grafico-card{
    background:var(--card);
    padding:20px;
    border-radius:20px;
}

canvas{
    width:100% !important;
}

.form-area{
    margin-top:30px;
    background:var(--card);
    padding:25px;
    border-radius:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:6px;
    font-size:13px;
    color:var(--text2);
}

.input-group input{
    background:var(--card2);
    border:none;
    padding:12px;
    border-radius:12px;
    color:white;
}

.botao{
    margin-top:20px;
    background:var(--primary);
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

.botao:hover{
    opacity:.9;
}

@media(max-width:900px){

.sidebar{
    width:100%;
    height:auto;
    position:relative;
}

.main{
    margin-left:0;
}

.graficos{
    grid-template-columns:1fr;
}

body{
    flex-direction:column;
}

}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
💰 Financeiro Família Santos
</div>

<div class="menu">

<button>🏠 Dashboard</button>

<button>📋 Planejamento</button>

<button>💳 Contas</button>

<button>🚗 Parcelamentos</button>

<button>🎯 Metas</button>

<button>📊 Histórico</button>

<button>⚙ Configurações</button>

</div>

</div>

<div class="main">

<div class="header">
<h1>Painel Financeiro</h1>
</div>

<div class="cards">

<div class="card">
<h3>Patrimônio Total</h3>
<div class="valor verde" id="patrimonio">
R$ 12.600
</div>
</div>

<div class="card">
<h3>Reserva Emergência</h3>
<div class="valor azul" id="reserva">
R$ 12.600
</div>
</div>

<div class="card">
<h3>Caixa Conjunto</h3>
<div class="valor roxo" id="conjunto">
R$ 0
</div>
</div>

<div class="card">
<h3>Caixa Matheus</h3>
<div class="valor">
R$ 400
</div>
</div>

<div class="card">
<h3>Caixa Nay</h3>
<div class="valor">
R$ 400
</div>
</div>

<div class="card">
<h3>Fundo Dente</h3>
<div class="valor">
R$ 0
</div>
</div>

<div class="card">
<h3>Fundo Carro</h3>
<div class="valor">
R$ 0
</div>
</div>

</div>

<div class="graficos">

<div class="grafico-card">
<h3>Receitas x Despesas</h3>
<canvas id="graficoReceita"></canvas>
</div>

<div class="grafico-card">
<h3>Evolução Patrimonial</h3>
<canvas id="graficoPatrimonio"></canvas>
</div>

</div>
