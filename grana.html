<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financeiro Familiar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Financeiro Familiar</h1>
<div class="cards">
<div class="card"><h3>Patrimônio</h3><span id="patrimonio">R$ 0,00</span></div>
<div class="card"><h3>Receitas</h3><span id="receitas">R$ 0,00</span></div>
<div class="card"><h3>Despesas</h3><span id="despesas">R$ 0,00</span></div>
</div>

<h2>Lançamentos</h2>
<input id="desc" placeholder="Descrição">
<input id="valor" type="number" placeholder="Valor">
<select id="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select>
<button onclick="add()">Salvar</button>

<ul id="lista"></ul>
<script src="app.js"></script>
</body>
</html>
