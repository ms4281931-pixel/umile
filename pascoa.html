<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Easter Tech Hunt</title>

<link rel="icon" type="image/png" href="https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  color:#fff;
}

/* 🎥 VÍDEO FIXO */
.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  filter:brightness(0.5);
  pointer-events:none;
}

/* OVERLAY */
body::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  z-index:-2;
  background:rgba(0,0,0,0.5);
}

.container{
  position:relative;
  z-index:1;
  width:95%;
  max-width:500px;
  padding:30px;
  border-radius:25px;
  background:rgba(10,10,30,0.65);
  backdrop-filter:blur(15px);
  box-shadow:0 0 30px rgba(0,255,200,0.2);
  text-align:center;
}

h1{color:#00ffd0;}
p{color:#ccc;margin-bottom:20px;}

.btn{
  background:linear-gradient(45deg,#00ffd0,#7a2bff);
  border:none;
  padding:14px;
  border-radius:40px;
  cursor:pointer;
  width:100%;
  margin:6px 0;
  color:#fff;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ffd0;
}

.hidden{display:none;}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.egg{
  width:85px;
  height:110px;
  background:url('https://i.ibb.co/sJk3rC10/freepik-preciso-dessa-imagem-em-png-sem-fundo-0001.png') center/contain no-repeat;
  cursor:pointer;
  transition:0.3s;
  margin:auto;
  filter:drop-shadow(0 10px 15px rgba(0,0,0,0.5));
}

.egg:hover{
  transform:scale(1.2) rotate(5deg);
}

/* animações diferentes */
.egg:nth-child(1){ animation:float1 3s ease-in-out infinite; }
.egg:nth-child(2){ animation:float2 3s ease-in-out infinite; }
.egg:nth-child(3){ animation:float3 3s ease-in-out infinite; }
.egg:nth-child(4){ animation:float4 3s ease-in-out infinite; }
.egg:nth-child(5){ animation:float5 3s ease-in-out infinite; }
.egg:nth-child(6){ animation:float6 3s ease-in-out infinite; }

@keyframes float1{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes float2{0%,100%{transform:translateX(0);}50%{transform:translateX(10px);}}
@keyframes float3{0%,100%{transform:translate(0,0);}50%{transform:translate(-10px,-10px);}}
@keyframes float4{0%,100%{transform:translate(0,0);}50%{transform:translate(10px,-10px);}}
@keyframes float5{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
@keyframes float6{0%,100%{transform:translate(0,0);}50%{transform:translate(-10px,10px);}}

.feedback{
  margin-top:15px;
  color:#00ffd0;
}

.loader{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid #00ffd0;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:20px auto;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- 🎥 VÍDEO -->
<video autoplay muted loop playsinline class="bg-video">
  <source src="https://pikaso.cdnpk.net/private/production/3736007523/1d331a23-bf5a-41d2-9a4d-90cac23d30d8-0.mp4?token=exp=1774742400~hmac=dd265f6cdfd621de05c13421667bed2930f2fb692a2bf5333147c0b5c82f1d7a" type="video/mp4">
</video>

<div class="container" id="step1">
  <h1>🐰 Easter Egg Hunt</h1>
  <p>Encontre o ovo premiado e ganhe até R$300</p>
  <button class="btn" onclick="next(1)">Começar</button>
</div>

<div class="container hidden" id="step2">
  <h1>💭 Sua Páscoa ideal?</h1>
  <button class="btn" onclick="next(2)">Chocolate</button>
  <button class="btn" onclick="next(2)">Família</button>
  <button class="btn" onclick="next(2)">Descanso</button>
</div>

<div class="container hidden" id="step3">
  <h1>🥚 Encontre o ovo premiado</h1>

  <div class="grid">
    <div class="egg" onclick="checkEgg(1)"></div>
    <div class="egg" onclick="checkEgg(2)"></div>
    <div class="egg" onclick="checkEgg(3)"></div>
    <div class="egg" onclick="checkEgg(4)"></div>
    <div class="egg" onclick="checkEgg(5)"></div>
    <div class="egg" onclick="checkEgg(6)"></div>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<div class="container hidden" id="step4">
  <h1>🔓 Liberando acesso...</h1>
  <div class="loader"></div>
</div>

<div class="container hidden" id="step5">
  <h1>🎉 Você entrou no concurso!</h1>
  <p>Envie sua foto e concorra a R$300</p>
  <button class="btn" onclick="resgatar()">Participar</button>
</div>

<script>
function next(n){
  document.getElementById("step"+n).classList.add("hidden");
  document.getElementById("step"+(n+1)).classList.remove("hidden");
}

let premiado = Math.floor(Math.random()*6)+1;

function checkEgg(n){
  let feedback = document.getElementById("feedback");

  if(n === premiado){
    feedback.innerHTML = "🎉 Encontrou!";
    setTimeout(()=>{
      next(3);
      setTimeout(()=> next(4),2000);
    },800);
  } else {
    let frases = ["Quase lá...", "Continue tentando...", "Tá perto!", "Não desista!"];
    feedback.innerHTML = frases[Math.floor(Math.random()*frases.length)];
  }
}

function resgatar(){
  window.location.href="SEU_LINK_DO_CONCURSO";
}
</script>

</body>
</html>
